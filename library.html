<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>መሠረተ ሃይማኖት ሰንበት ትምህርት ቤት</title>
    <link rel="icon" type="image/png" href="logo.png">
    <link rel="manifest" href="manifest.json">

    <style>
        :root {
            --purple: #5A1D6E;
            --gold: #FFD700;
            --bg: #F4F0F8;
            --card-bg: #FFFFFF;
            --text-color: #333333;
            --border-color: #CCCCCC;
        }

        body.dark-mode {
            --bg: #121212;
            --card-bg: #1E1E1E;
            --text-color: #E0E0E0;
            --border-color: #333333;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text-color);
            margin: 0;
            padding: 0;
            transition: background 0.3s, color 0.3s;
        }

        header {
            background-color: var(--purple);
            color: white;
            text-align: center;
            padding: 20px 15px;
            border-bottom: 5px solid var(--gold);
            position: relative;
        }

        header img {
            width: 75px;
            height: 75px;
            border-radius: 50%;
            border: 3px solid var(--gold);
            object-fit: cover;
        }

        header h1 { margin: 5px 0; font-size: 18px; }
        header p { color: var(--gold); font-size: 12px; margin: 2px 0; font-weight: bold; }

        .theme-toggle {
            position: absolute;
            top: 15px;
            right: 15px;
            background: rgba(255, 255, 255, 0.2);
            border: none;
            color: white;
            padding: 8px 12px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 13px;
        }

        .nav-bar {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin: 15px 0;
        }

        .btn-nav {
            color: var(--purple);
            text-decoration: none;
            font-weight: bold;
            background-color: var(--gold);
            padding: 8px 14px;
            border-radius: 20px;
            font-size: 12px;
        }

        .container {
            max-width: 750px;
            margin: 15px auto;
            padding: 0 12px;
        }

        /* Stats Cards */
        .stats-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(100px, 1fr));
            gap: 8px;
            margin-bottom: 15px;
        }

        .stat-card {
            background: var(--card-bg);
            padding: 10px;
            border-radius: 8px;
            text-align: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            border-top: 3px solid var(--purple);
        }

        .stat-card h4 { margin: 0; font-size: 11px; opacity: 0.8; }
        .stat-card p { margin: 3px 0 0 0; font-size: 16px; font-weight: bold; color: var(--purple); }
        body.dark-mode .stat-card p { color: var(--gold); }

        .search-box {
            width: 100%;
            padding: 12px;
            border: 2px solid var(--purple);
            border-radius: 8px;
            font-size: 14px;
            box-sizing: border-box;
            margin-bottom: 15px;
            background: var(--card-bg);
            color: var(--text-color);
            outline: none;
        }

        .category-tabs { display: flex; gap: 8px; margin-bottom: 15px; overflow-x: auto; padding-bottom: 5px; }
        .tab-btn { background: var(--card-bg); border: 1px solid var(--border-color); padding: 8px 14px; border-radius: 20px; font-size: 12px; font-weight: bold; cursor: pointer; white-space: nowrap; color: var(--text-color); }
        .tab-btn.active { background: var(--purple); color: white; border-color: var(--purple); }

        .doc-card {
            background: var(--card-bg);
            border-radius: 8px;
            padding: 14px;
            margin-bottom: 12px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.06);
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-left: 5px solid var(--purple);
            flex-wrap: wrap;
            gap: 10px;
        }

        .doc-info h3 { margin: 0 0 4px; color: var(--purple); font-size: 15px; }
        body.dark-mode .doc-info h3 { color: #FFF; }
        .doc-info p { margin: 0; font-size: 12px; opacity: 0.8; }
        .badge { background: rgba(90, 29, 110, 0.1); color: var(--purple); padding: 2px 6px; border-radius: 4px; font-size: 11px; }
        body.dark-mode .badge { background: rgba(255, 215, 0, 0.2); color: var(--gold); }

        .actions { display: flex; gap: 5px; align-items: center; flex-wrap: wrap; }
        .btn-action { text-decoration: none; padding: 6px 10px; border-radius: 5px; font-weight: bold; font-size: 11px; cursor: pointer; border: none; }
        .btn-view { background: var(--purple); color: white; }
        .btn-download { background: #28a745; color: white; }
        .btn-share { background: #0088cc; color: white; }
        .btn-fav { background: transparent; border: 1px solid var(--border-color); font-size: 14px; }
        .btn-delete { background: #dc3545; color: white; }

        /* PDF Modal Viewer */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85);
            z-index: 1000;
        }

        .modal-content {
            position: relative;
            width: 90%; max-width: 800px; height: 85%;
            margin: 40px auto;
            background: white; border-radius: 8px;
            overflow: hidden;
        }

        .close-modal {
            position: absolute; top: 8px; right: 12px;
            background: #dc3545; color: white;
            border: none; padding: 6px 12px; border-radius: 4px;
            font-weight: bold; cursor: pointer; z-index: 1001;
        }

        iframe { width: 100%; height: 100%; border: none; }
    </style>
</head>
<body>

    <header>
        <button class="theme-toggle" onclick="toggleTheme()" id="themeBtn">🌙 Dark</button>
        <img src="logo.png" alt="Logo" onerror="this.src='https://cdn-icons-png.flaticon.com/512/3237/3237472.png'">
        <h1>መሠረተ ሃይማኖት ሰንበት ትምህርት ቤት</h1>
        <p>ኪነ-ጥበብ እና ስነ-ጥበብ ክፍል</p>
    </header>

    <div class="nav-bar">
        <a href="index.html" class="btn-nav">⬅ መግቢያ ገጽ</a>
        <a href="upload.html" class="btn-nav">➕ ሰነድ ስቀል</a>
    </div>

    <div class="container">

        <!-- Statistics Counter -->
        <div class="stats-container">
            <div class="stat-card"><h4>ጠቅላላ</h4><p id="statTotal">0</p></div>
            <div class="stat-card"><h4>ግጥም</h4><p id="statPoem">0</p></div>
            <div class="stat-card"><h4>ድራማ</h4><p id="statDrama">0</p></div>
            <div class="stat-card"><h4>መነባነብ</h4><p id="statMonologue">0</p></div>
            <div class="stat-card"><h4>ስነ ፅሁፍ</h4><p id="statLit">0</p></div>
        </div>

        <input type="text" id="searchInput" class="search-box" onkeyup="filterDocs()" placeholder="🔍 የሰነዱን ርዕስ ወይም ጸሐፊ ይፈልጉ...">

        <div class="category-tabs">
            <button class="tab-btn active" onclick="setCategory('ሁሉም', this)">ሁሉም</button>
            <button class="tab-btn" onclick="setCategory('❤️ የተወደዱ', this)">❤️ የተወደዱ</button>
            <button class="tab-btn" onclick="setCategory('ግጥም', this)">ግጥም</button>
            <button class="tab-btn" onclick="setCategory('ድራማ', this)">ድራማ</button>
            <button class="tab-btn" onclick="setCategory('መነባነብ', this)">መነባነብ</button>
            <button class="tab-btn" onclick="setCategory('ስነ ፅሁፍ', this)">ስነ ፅሁፍ</button>
        </div>

        <div id="documentContainer"></div>

    </div>

    <!-- PDF Viewer Modal -->
    <div id="pdfModal" class="modal">
        <div class="modal-content">
            <button class="close-modal" onclick="closePdf()">❌ ዝጋ</button>
            <iframe id="pdfFrame" src=""></iframe>
        </div>
    </div>

<script>
    let documents = JSON.parse(localStorage.getItem('mesereteDocs')) || [];
    let favorites = JSON.parse(localStorage.getItem('mesereteFavs')) || [];
    let selectedCategory = 'ሁሉም';

    // Dark Mode Toggle
    if (localStorage.getItem('theme') === 'dark') {
        document.body.classList.add('dark-mode');
    }

    function toggleTheme() {
        document.body.classList.toggle('dark-mode');
        let isDark = document.body.classList.contains('dark-mode');
        localStorage.setItem('theme', isDark ? 'dark' : 'light');
    }

    // Toggle Favorite
    function toggleFav(id) {
        if (favorites.includes(id)) {
            favorites = favorites.filter(favId => favId !== id);
        } else {
            favorites.push(id);
        }
        localStorage.setItem('mesereteFavs', JSON.stringify(favorites));
        renderDocs();
    }

    // Open/Close PDF Modal
    function viewPdf(url) {
        document.getElementById('pdfFrame').src = url;
        document.getElementById('pdfModal').style.display = 'block';
    }

    function closePdf() {
        document.getElementById('pdfModal').style.display = 'none';
        document.getElementById('pdfFrame').src = '';
    }

    // Share to Telegram
    function shareDoc(title, link) {
        let text = encodeURIComponent(`📄 "${title}"\nከመሠረተ ሃይማኖት ሰንበት ትምህርት ቤት ኪነ-ጥበብ ክፍል የተላከ፦\n${link}`);
        window.open(`https://t.me/share/url?url=${link}&text=${text}`, '_blank');
    }

    function deleteDoc(id) {
        if(confirm("ይህንን ሰነድ ማጥፋት እርግጠኛ ነዎት?")) {
            documents = documents.filter(doc => doc.id !== id);
            localStorage.setItem('mesereteDocs', JSON.stringify(documents));
            renderDocs();
        }
    }

    function updateStats() {
        document.getElementById('statTotal').innerText = documents.length;
        document.getElementById('statPoem').innerText = documents.filter(d => d.category === 'ግጥም').length;
        document.getElementById('statDrama').innerText = documents.filter(d => d.category === 'ድራማ').length;
        document.getElementById('statMonologue').innerText = documents.filter(d => d.category === 'መነባነብ').length;
        document.getElementById('statLit').innerText = documents.filter(d => d.category === 'ስነ ፅሁፍ').length;
    }

    function renderDocs() {
        updateStats();
        let container = document.getElementById('documentContainer');
        container.innerHTML = '';

        let now = Date.now();
        let twentyFourHours = 24 * 60 * 60 * 1000;

        let filtered = documents.filter(doc => {
            if (selectedCategory === '❤️ የተወደዱ') return favorites.includes(doc.id);
            return selectedCategory === 'ሁሉም' || doc.category === selectedCategory;
        });

        if (filtered.length === 0) {
            container.innerHTML = `<p style="text-align: center; opacity: 0.6; padding: 20px;">ምንም የተገኘ ሰነድ የለም</p>`;
            return;
        }

        filtered.forEach(doc => {
            let isFav = favorites.includes(doc.id);
            let isDeletable = (now - doc.timestamp) < twentyFourHours;
            let deleteBtn = isDeletable ? `<button class="btn-action btn-delete" onclick="deleteDoc(${doc.id})">🗑️</button>` : '';

            let card = `
                <div class="doc-card">
                    <div class="doc-info">
                        <h3>${doc.title} <span class="badge">${doc.category}</span></h3>
                        <p>ደራሲ፦ ${doc.author}</p>
                    </div>
                    <div class="actions">
                        <button class="btn-action btn-fav" onclick="toggleFav(${doc.id})">${isFav ? '❤️' : '🤍'}</button>
                        <button class="btn-action btn-view" onclick="viewPdf('${doc.link}')">👁️ ክፍት አድርግ</button>
                        <a href="${doc.link}" download="${doc.title}.pdf" target="_blank" class="btn-action btn-download">📥 አውርድ</a>
                        <button class="btn-action btn-share" onclick="shareDoc('${doc.title}', '${doc.link}')">✈️ Share</button>
                        ${deleteBtn}
                    </div>
                </div>
            `;
            container.innerHTML += card;
        });

        filterDocs();
    }

    function setCategory(cat, btn) {
        selectedCategory = cat;
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        renderDocs();
    }

    function filterDocs() {
        let query = document.getElementById('searchInput').value.toLowerCase();
        let cards = document.getElementsByClassName('doc-card');

        for (let i = 0; i < cards.length; i++) {
            let text = cards[i].innerText.toLowerCase();
            cards[i].style.display = text.includes(query) ? "flex" : "none";
        }
    }

    renderDocs();
</script>

</body>
</html>
