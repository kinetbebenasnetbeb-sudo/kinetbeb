<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>እንኳን ደህና መጣችሁ - ኪነ-ጥበብ</title>
    <link rel="icon" type="image/png" href="logo.png">
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Arial, sans-serif;
            background-color: #5A1D6E;
            color: white;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            text-align: center;
        }
        .welcome-card {
            background-color: rgba(255, 255, 255, 0.1);
            padding: 40px 20px;
            border-radius: 20px;
            border: 2px solid #FFD700;
            box-shadow: 0 8px 25px rgba(0,0,0,0.3);
            max-width: 400px;
            width: 90%;
            backdrop-filter: blur(5px);
        }
        .welcome-card img {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            border: 4px solid #FFD700;
            object-fit: cover;
            margin-bottom: 20px;
            background-color: #fff;
        }
        h1 {
            color: #FFD700;
            font-size: 24px;
            margin-bottom: 10px;
        }
        h2 {
            font-size: 18px;
            margin-top: 0;
            font-weight: normal;
        }
        p {
            font-size: 15px;
            line-height: 1.6;
            margin: 20px 0 30px;
            color: #f0f0f0;
        }
        .btn-enter {
            display: inline-block;
            background-color: #FFD700;
            color: #5A1D6E;
            padding: 14px 30px;
            text-decoration: none;
            font-weight: bold;
            font-size: 16px;
            border-radius: 30px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            transition: transform 0.2s;
        }
        .btn-enter:active {
            transform: scale(0.95);
        }
    </style>
</head>
<body>

    <div class="welcome-card">
        <img src="logo.png" alt="Logo" onerror="this.src='https://cdn-icons-png.flaticon.com/512/3237/3237472.png'">
        <h1>መሰረተ ሃይማኖት ሰንበት ትምህርት ቤት</h1>
        <h2>የኪነ-ጥበብ እና ስነ-ጥበብ ክፍል</h2>
        
        <p>✨ እንኳን ወደ ሰነዶች እና ስራዎች ማጋሪያ አፕሊኬሽን በደህና መጣችሁ! ✨</p>
        
        <a href="index.html" class="btn-enter">ወደ ሰነዶች ይለፉ ➔</a>
    </div>

</body>
</html>
