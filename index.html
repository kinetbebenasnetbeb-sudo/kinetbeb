<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>መሠረተ ሃይማኖት ሰንበት ትምህርት ቤት - ኪነ-ጥበብ</title>
    <link rel="icon" type="image/png" href="logo.png">
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="logo.png">
    <link rel="shortcut icon" href="logo.png" type="image/png">

    <style>
        :root {
            --purple: #5A1D6E;
            --gold: #FFD700;
            --bg: #F4F0F8;
            --card-bg: #FFFFFF;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Arial, sans-serif;
            background-color: var(--bg);
            margin: 0;
            padding: 0;
            text-align: center;
        }

        header {
            background-color: var(--purple);
            color: white;
            padding: 30px 15px;
            border-bottom: 5px solid var(--gold);
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }

        header img {
            width: 110px;
            height: 110px;
            border-radius: 50%;
            border: 3px solid var(--gold);
            object-fit: cover;
            margin-bottom: 10px;
            background-color: #fff;
        }

        header h1 { margin: 5px 0; font-size: 22px; }
        header p { color: var(--gold); font-size: 14px; font-weight: bold; margin: 5px 0; }

        .container {
            max-width: 500px;
            margin: 25px auto;
            padding: 0 20px;
        }

        /* 👉 የእንኳን ደህና መጣችሁ ካርድ ስታይል 👈 */
        .welcome-card {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 25px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.06);
            border-top: 4px solid var(--gold);
        }

        .welcome-card h2 {
            color: var(--purple);
            margin-top: 0;
            margin-bottom: 8px;
            font-size: 18px;
        }

        .welcome-card p {
            color: #555;
            font-size: 14px;
            line-height: 1.5;
            margin: 0;
        }

        .btn-card {
            background: var(--card-bg);
            display: block;
            padding: 18px;
            margin-bottom: 20px;
            border-radius: 12px;
            text-decoration: none;
            color: var(--purple);
            font-weight: bold;
            font-size: 16px;
            border-left: 6px solid var(--purple);
            box-shadow: 0 4px 8px rgba(0,0,0,0.08);
            transition: 0.3s;
        }

        .btn-card:hover {
            background: var(--purple);
            color: white;
            transform: translateY(-2px);
        }

        .btn-upload {
            border-left-color: #008751;
        }
    </style>
</head>
<body>

<header>
    <img src="logo.png" alt="Logo" onerror="this.src='https://cdn-icons-png.flaticon.com/512/3237/3237472.png'">
    <h1>መሠረተ ሃይማኖት ሰንበት ትምህርት ቤት </h1>
    <p>ኪነ-ጥበብ እና ስነጥበብ ክፍል</p>
</header>

<div class="container">
    
    <!-- 👉 የእንኳን ደህና መጣችሁ መልእክት 👈 -->
    <div class="welcome-card">
        <h2>እንኳን ደህና መጡ! 🕊️</h2>
        <p>በዚህ ገጽ ሰነዶች፣ ግጥሞች፣ ድራማዎች እና መነባነቦች በቀላሉ ማግኘት ወይም አዲስ ሰነድ መጫን ይችላሉ።</p>
    </div>

    <!-- የገጽ ማያያዣ ቁልፎች -->
    <a href="library.html" class="btn-card">🔎 መፈለጊያ (Library)</a>
    <a href="upload.html" class="btn-card btn-upload">➕ አዲስ ሰነድ መጫኛ (Upload)</a>
</div>

</body>
</html>
