<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>መግቢያ - ኪነ-ጥበብ እና ስነ-ጥበብ ክፍል</title>
    <link rel="icon" type="image/png" href="logo.png?v=2">
    <link rel="manifest" href="manifest.json">

    <style>
        :root {
            --purple: #5A1D6E;
            --gold: #FFD700;
            --bg: #F4F0F8;
            --card-bg: #FFFFFF;
            --text-color: #333333;
            --border-color: #E0E0E0;
        }

        body.dark-mode {
            --bg: #121212;
            --card-bg: #1E1E1E;
            --text-color: #E0E0E0;
            --border-color: #333333;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text-color);
            margin: 0;
            padding: 0;
            transition: background 0.3s, color 0.3s;
        }

        header {
            background-color: var(--purple);
            color: white;
            text-align: center;
            padding: 25px 15px;
            border-bottom: 5px solid var(--gold);
            position: relative;
        }

        header img {
            width: 95px;
            height: 95px;
            border-radius: 50%;
            border: 3px solid var(--gold);
            object-fit: cover;
        }

        header h1 { margin: 10px 0 5px; font-size: 20px; }
        header p { color: var(--gold); font-size: 13px; margin: 0; font-weight: bold; }

        .theme-toggle {
            position: absolute;
            top: 15px;
            right: 15px;
            background: rgba(255, 255, 255, 0.2);
            border: none;
            color: white;
            padding: 8px 12px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 13px;
        }

        .container {
            max-width: 500px;
            margin: 30px auto;
            padding: 0 15px;
            text-align: center;
        }

        .welcome-card {
            background: var(--card-bg);
            padding: 25px 20px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.08);
            border-top: 4px solid var(--purple);
        }

        .welcome-card h2 { color: var(--purple); margin-top: 0; font-size: 18px; }
        body.dark-mode .welcome-card h2 { color: var(--gold); }
        .welcome-card p { font-size: 14px; line-height: 1.6; opacity: 0.85; }

        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-top: 25px;
        }

        .btn {
            display: block;
            padding: 14px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: bold;
            font-size: 15px;
            transition: 0.2s;
        }

        .btn-primary { background: var(--purple); color: white; }
        .btn-secondary { background: var(--gold); color: var(--purple); }
    </style>
</head>
<body>

<header>
    <button class="theme-toggle" onclick="toggleTheme()" id="themeBtn">🌙 Dark</button>
    <img src="logo.png?v=2" alt="Logo" onerror="this.src='https://cdn-icons-png.flaticon.com/512/3237/3237472.png'">
    <h1>መሠረተ ሃይማኖት ሰንበት ትምህርት ቤት</h1>
    <p>ኪነ-ጥበብ እና ስነ-ጥበብ ክፍል</p>
</header>

<div class="container">
    <div class="welcome-card">
        <h2>እንኳን ደህና መጡ!</h2>
        <p>እዚህ ገጽ ላይ የክፍሉን ድራማዎች፣ ግጥሞች፣ መነባነቦች እና የተለያዩ ስነ-ጽሁፎችን ማግኘት፣ ማነበብ እንዲሁም አዳዲስ ሰነዶችን መስቀል ይችላሉ።</p>
        
        <div class="btn-group">
            <a href="library.html" class="btn btn-primary">ወደ የተጫኑ ሰነዶች ግባ</a>
            <a href="upload.html" class="btn btn-secondary">አዲስ ሰነድ ስቀል</a>
        </div>
    </div>
</div>

<script>
    const themeBtn = document.getElementById('themeBtn');

    if (localStorage.getItem('theme') === 'dark') {
        document.body.classList.add('dark-mode');
        if (themeBtn) themeBtn.innerText = '☀️ Light';
    }

    function toggleTheme() {
        document.body.classList.toggle('dark-mode');
        let isDark = document.body.classList.contains('dark-mode');
        localStorage.setItem('theme', isDark ? 'dark' : 'light');
        if (themeBtn) themeBtn.innerText = isDark ? '☀️ Light' : '🌙 Dark';
    }
</script>

</body>
</html>
